[project]
name = "ocr-genealogy-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "datasets>=2.19.0",
    "evaluate>=0.4.0",
    "seqeval>=1.2.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "faker>=24.0.0",
    "gradio>=4.26.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "accelerate>=0.29.0",
    "jiwer>=3.0.3",
    "opencv-python-headless>=4.9.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
